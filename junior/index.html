<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Beam On! Junior</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: a toy hospital floor. the player's own medical physicist avatar and speech bubble on top, four chunky room "doors" below; each room opens one big play stage with picture-only progress chips. Single bright look by design. */
:root{
  --wall:#E6F3EE; --tile:#D8EBE4; --ink:#123C43; --ink-soft:#4A6B70;
  --coral:#F26B4F; --sun:#FFC53D; --sky:#58B6E0; --leaf:#2FA673; --card:#FFFFFF; --grey:#C9D6D3;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background-color:var(--wall);background-image:linear-gradient(var(--tile) 2px,transparent 2px),linear-gradient(90deg,var(--tile) 2px,transparent 2px);background-size:56px 56px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
.app{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
button{font:inherit;color:inherit}
button:focus-visible,[role=button]:focus-visible,canvas:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

header.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:52px;height:52px;flex:none}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);margin:0;line-height:1;letter-spacing:-.01em}
.brand h1 span{color:var(--coral)}
.brand p{margin:4px 0 0;color:var(--ink-soft);font-size:16px}
.toggles{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.seg button{font:600 15px var(--display);border:0;background:transparent;padding:0 14px;min-height:42px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.round{width:48px;height:48px;border:3px solid var(--ink);border-radius:50%;background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.round svg{width:24px;height:24px}
.round[aria-pressed="false"]{background:var(--grey)}

.helper{display:flex;gap:12px;align-items:flex-end;margin:22px 0 20px}
.ana{width:84px;flex:none}
.bubble{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:14px 14px 14px 18px;box-shadow:4px 4px 0 var(--ink);flex:1;min-width:0;display:flex;gap:12px;align-items:center}
.bubble::before{content:"";position:absolute;left:-15px;bottom:18px;width:22px;height:22px;background:var(--card);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) skew(10deg,10deg)}
.bubble p{margin:0;font-size:18px;max-width:64ch;flex:1;min-width:0;position:relative}
.bubble p.say{animation:say .35s ease-out}

.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:620px){.rooms{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media (min-width:940px){.rooms{grid-template-columns:repeat(5,minmax(0,1fr))}.room .meta{padding:12px 12px 14px}.room h2{font-size:19px!important;letter-spacing:-.01em}}
.room h2{text-wrap:balance;font-size:22px;overflow-wrap:break-word}
@media (max-width:619px){.room .meta{padding:10px 11px 12px}.room h2{font-size:18px!important;letter-spacing:-.01em}.room .tag{font-size:14px}}
.room{text-align:left;border:3px solid var(--ink);border-radius:22px;background:var(--card);box-shadow:5px 5px 0 var(--ink);padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.room:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.room:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.room .art{background:var(--c);border-bottom:3px solid var(--ink);aspect-ratio:4/3;display:grid;place-items:center;max-width:100%}
.room .art svg{width:76%;height:auto}
.room .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.room h2{font:700 25px var(--display);margin:0;line-height:1.1}
.room .tag{color:var(--ink-soft);font-size:15px}
.stars{display:flex;gap:3px;margin-top:6px}
.stars svg{width:26px;height:26px}

.cert{margin-top:22px;display:flex;gap:16px;align-items:center;background:var(--sun);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);padding:14px 18px}
.cert svg{width:76px;flex:none}
.cert h2{font:700 24px var(--display);margin:0}
.cert p{margin:2px 0 0}

footer{margin-top:34px;padding-top:16px;border-top:3px dashed var(--grey);display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;color:var(--ink-soft);font-size:15px}
footer p{margin:0;max-width:62ch}
.footL{flex:1 1 380px;min-width:0;display:grid;gap:10px;align-content:start}
.footR{flex:0 1 330px;min-width:0}
.credit{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:22px 10px 10px;color:var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:13px;line-height:1.4;overflow:hidden}
.credit .bunting{position:absolute;left:0;right:0;top:0;height:16px;width:100%}
.credit .confetti{position:absolute;inset:0;pointer-events:none}
.credit .girl{grid-row:1 / 3;grid-column:1;width:50px;height:58px;align-self:start;position:relative}
.credit .girl svg,.credit .curie svg{width:100%;height:100%;display:block}
.credit .curie{grid-row:1 / 3;grid-column:3;display:flex;flex-direction:column;align-items:center;gap:1px;align-self:start;width:52px}
.credit .curie svg{width:46px;height:46px}
.credit .curie small{font:600 10px var(--display);line-height:1.1;text-align:center;color:var(--ink-soft)}
.credit h3{margin:0;font:700 15px var(--display);line-height:1.2;grid-column:2;grid-row:1;align-self:end;position:relative}
.credit p{margin:0;max-width:none;grid-column:2;grid-row:2;align-self:start;position:relative}
.credit .cbtn{grid-column:2;grid-row:3;justify-self:start;min-height:34px;font-size:13px;padding:0 12px 0 6px;margin-top:6px;position:relative;box-shadow:2px 2px 0 var(--ink)}
.credit .cbtn svg{width:18px;height:18px}
.credit b,.credit h3{white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.credit .confetti circle,.credit .confetti rect{animation:twinkle 2.4s ease-in-out infinite}.credit .confetti :nth-child(2n){animation-delay:.8s}.credit .confetti :nth-child(3n){animation-delay:1.6s}}
@keyframes twinkle{50%{opacity:.25}}
footer a{color:var(--ink);font-weight:700}
.linkish{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:var(--ink-soft);font-size:15px}

.playbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 17px var(--display);border:3px solid var(--ink);border-radius:999px;background:var(--card);padding:0 16px 0 10px;min-height:48px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.pill svg{width:22px;height:22px}
.playbar h2{font:700 clamp(24px,4vw,32px) var(--display);margin:0;flex:1;min-width:0}
.play .helper{margin:16px 0 0}
.play .ana{width:64px}
.stage{margin-top:16px;border:3px solid var(--ink);border-radius:22px;overflow:hidden;background:var(--card);box-shadow:5px 5px 0 var(--ink);position:relative}
.stage canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;max-width:100%}
.chips{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.chip{width:62px;height:62px;border:3px solid var(--ink);border-radius:16px;background:var(--card);display:grid;place-items:center;opacity:.35;filter:grayscale(1)}
.chip svg{width:42px;height:42px}
.chip.got{opacity:1;filter:none;background:var(--sun);animation:pop .45s}
.controls{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:16px}
.cta{font:700 22px var(--display);letter-spacing:.02em;border:3px solid var(--ink);border-radius:999px;padding:0 30px;min-height:58px;background:var(--coral);color:var(--card);box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.cta:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.cta[disabled]{background:var(--grey);color:var(--ink-soft);box-shadow:none;cursor:not-allowed}
.cta.ready{animation:pulse 1s ease-in-out infinite}
.cta.ok{background:var(--leaf)}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:6px}
.pad button{border:3px solid var(--ink);border-radius:12px;background:var(--card);cursor:pointer;display:grid;place-items:center}
.pad button svg{width:22px}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.readout{font:600 18px var(--display);font-variant-numeric:tabular-nums;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:6px 14px;min-width:12ch;text-align:center}
.bar{width:min(320px,80%);height:22px;border:3px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sky);transition:width .2s}

.mri{padding:16px;display:grid;gap:16px}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;min-height:96px}
.item{border:3px solid var(--ink);border-radius:16px;background:var(--wall);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font:600 13px var(--display);line-height:1.15;text-align:center;min-height:84px;justify-content:center}
.item svg{width:54px;height:54px;pointer-events:none}
.item span{pointer-events:none}
.item.sel{background:var(--sun)}
.item.lifted{opacity:.3}
.item.ghost{position:fixed;z-index:60;margin:0;pointer-events:none;background:var(--sun);box-shadow:6px 6px 0 var(--ink);transform:rotate(-4deg) scale(1.08);cursor:grabbing}
.shake{animation:shake .45s}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.zone{border:3px dashed var(--ink);border-radius:18px;padding:10px 8px;background:var(--wall);display:flex;flex-direction:column;align-items:center;gap:6px;min-height:200px;cursor:pointer;min-width:0}
.zone.hot{background:#FFF2CC;border-style:solid}
.zone svg.zart{width:min(150px,92%);height:auto}
.zone h3{font:700 19px var(--display);margin:0;text-align:center}
.zone .got{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.zone .got svg{width:30px;height:30px}
.left{font:600 16px var(--display);color:var(--ink-soft);text-align:center}

.qa{padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.qa svg{width:min(380px,100%);height:auto}
.qa .readout{font-size:22px}

.overlay{position:fixed;inset:0;background:rgba(18,60,67,.55);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.card{background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--ink);padding:22px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;animation:pop .35s}
.card h2{font:700 30px var(--display);margin:0;text-align:center;text-wrap:balance}
.card p{margin:0}
.card .bigstars{display:flex;justify-content:center;gap:8px}
.card .bigstars svg{width:62px;height:62px}
.card .bigstars svg.on{animation:pop .5s backwards}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--wall);border-radius:16px;padding:10px 12px;font-size:16px}
.tip svg{width:40px;flex:none}
.eyebrow{font:600 14px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);text-align:center}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:12px 14px;cursor:pointer;font-size:17px;min-height:52px}
.opt.yes{background:#CDEFDD}.opt.no{background:#FFD9CF}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row .cta{font-size:19px;min-height:52px;padding:0 22px}
.row .cta.alt{background:var(--card);color:var(--ink)}

.w{border-radius:6px;transition:background .12s,box-shadow .12s}
.w.hi{background:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.vlist{display:grid;gap:8px;max-height:52vh;overflow:auto}
.vrow{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;cursor:pointer}
.vrow:has(input:checked){background:#FFF2CC}
.vrow input{width:22px;height:22px;accent-color:var(--coral);flex:none}
.vname{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.vname small{display:block;font-weight:400;color:var(--ink-soft)}
.vtest{border:3px solid var(--ink);border-radius:999px;background:var(--card);font:600 15px var(--display);padding:0 14px;min-height:40px;cursor:pointer;flex:none}
.ana{display:flex;flex-direction:column;align-items:center;gap:4px}
.ana svg{width:100%;height:auto}
.nametag{font:600 13px var(--display);background:var(--ink);color:var(--card);border-radius:999px;padding:2px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:999px;background:var(--card);padding:0 14px 0 3px;min-height:48px;cursor:pointer;font:600 16px var(--display);max-width:210px}
.who .wname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.head{display:block;border-radius:50%;overflow:hidden;background:#DCEFF7;border:3px solid var(--ink);flex:none}
.head svg{display:block;width:100%;height:100%}
.who .head{width:38px;height:38px;border-width:2px}
.hubbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin:0 0 16px}
.total{font:600 18px var(--display);font-variant-numeric:tabular-nums;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:8px 16px}
.mark{font:600 15px var(--display);font-variant-numeric:tabular-nums;color:var(--ink-soft);margin-left:6px;align-self:center}
.field{display:grid;gap:6px}
.field label,.flabel{font:600 16px var(--display)}
.field input{width:100%;font:600 22px var(--display);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;min-height:54px;background:var(--card);color:var(--ink)}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avopt{position:relative;cursor:pointer;display:block}
.avopt input{position:absolute;opacity:0;pointer-events:none}
.avopt .head{width:100%;aspect-ratio:1;height:auto;max-width:100%;transition:transform .12s}
.avopt:hover .head{transform:scale(1.04)}
.avopt input:checked+.head{background:var(--sun);box-shadow:0 0 0 4px var(--coral)}
.avopt input:focus-visible+.head{outline:4px solid var(--sky);outline-offset:3px}
.hiprev{text-align:center;font:600 20px var(--display);margin:0;min-height:1.4em}
.plist{display:grid;gap:8px;max-height:46vh;overflow:auto;padding:2px}
.prow{display:flex;align-items:center;gap:8px}
.pbtn{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:6px 12px 6px 6px;cursor:pointer;text-align:left;font:600 18px var(--display)}
.pbtn>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn .head{width:50px;height:50px}
.pbtn small{display:block;font:400 14px var(--body);color:var(--ink-soft)}
.pbtn.on{background:#FFF2CC}
.xbtn{border:3px solid var(--ink);border-radius:12px;background:var(--card);min-height:50px;padding:0 12px;cursor:pointer;font:600 14px var(--display);flex:none}
.xbtn.arm{background:var(--coral);color:var(--card)}
.card.congrats{position:relative;overflow:hidden;border-width:4px;background:linear-gradient(#FFF7D6,#fff 45%)}
.confetti-rain{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti-rain i{position:absolute;top:-14px;width:9px;height:14px;opacity:.9;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(720px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.confetti-rain{display:none}}
.rosette{position:relative;width:110px;margin:0 auto;animation:pop .6s}
.rosette>svg{width:110px;height:auto;display:block}
.rosette .rav .head svg{width:100%;height:100%}
.rosette .rav{position:absolute;right:-26px;bottom:6px}
.rosette .rav .head{width:52px;height:52px}
.congrats h2{position:relative}
.congsub{text-align:center;margin:-4px 0 0;color:var(--ink-soft);font:600 17px var(--display);position:relative}
.clabel{display:block;font:600 18px var(--display);color:var(--ink-soft)}
.cgrid{display:grid;gap:4px;background:var(--wall);border-radius:16px;padding:10px 14px;position:relative}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:10px;align-items:center;font:600 16px var(--display)}
.crow .cst{display:flex;gap:2px}.crow .cst svg{width:20px;height:20px}
.crow b{text-align:right;font-variant-numeric:tabular-nums}
.congjmp{text-align:center;margin:0;font:700 22px var(--display);color:var(--coral);text-wrap:balance;position:relative}
.thanks{text-align:center;font:600 18px var(--display);margin:-6px 0 0;color:var(--ink-soft);text-wrap:balance}
.score{text-align:center;font-family:var(--display);font-variant-numeric:tabular-nums;margin:-4px 0 0}
.score b{font-size:64px;line-height:1}
.score span{font-size:24px;color:var(--ink-soft)}
.best{display:inline-block;background:var(--leaf);color:var(--card);border-radius:999px;padding:3px 12px;font:600 15px var(--display);vertical-align:middle;margin-left:6px}
.marks{display:grid;gap:7px;background:var(--wall);border-radius:16px;padding:12px 14px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 80px 58px;gap:10px;align-items:center;font-size:16px}
.mrow i{height:12px;border-radius:999px;background:var(--card);border:2px solid var(--ink);overflow:hidden;display:block}
.mrow i b{display:block;height:100%;background:var(--leaf)}
.mrow .v{text-align:right;font:600 16px var(--display);font-variant-numeric:tabular-nums}
.mrow.time{color:var(--ink-soft);font-size:15px}
.sgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;margin-top:16px;align-items:start}
@media (max-width:760px){.sgrid{grid-template-columns:1fr}}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);padding:16px;min-width:0}
.panel h3{font:700 21px var(--display);margin:0 0 4px}
.panel .sub{color:var(--ink-soft);margin:0 0 10px;font-size:15px}
.chart{overflow-x:auto}
.chart svg{width:100%;height:auto;min-width:300px;display:block}
.board{display:grid;gap:6px}
.brow{display:grid;grid-template-columns:30px 44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border-radius:14px}
.brow.me{background:#FFF2CC}
.brow .rk{font:700 18px var(--display);text-align:center}
.brow .head{width:44px;height:44px;border-width:2px}
.brow .nm{font:600 17px var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .nm small{display:block;font:400 13px var(--body);color:var(--ink-soft)}
.brow .pt{font:700 19px var(--display);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table.recent{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:16px}
table.recent th{font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:6px 8px;border-bottom:3px solid var(--ink)}
table.recent td{padding:8px;border-bottom:2px dashed var(--grey)}
table.recent td.n,table.recent th.n{text-align:right}
.mchip{display:inline-block;font:600 13px var(--display);border:2px solid var(--ink);border-radius:999px;padding:0 8px}
.empty{color:var(--ink-soft);margin:6px 0}
.tr{display:block;font-size:.7em;font-weight:500;opacity:.72;line-height:1.2;margin-top:2px}
.card h2 .tr{font-size:.62em;margin-top:4px}
.cta .tr{font-size:.66em;margin-top:0}
.field label .tr,.flabel .tr{font-size:.85em}
.hiprev .tr,.agehint .tr{font-size:.9em}
.bihead{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.bubble{flex-wrap:wrap}
.bubble p{flex:1 1 260px}
.vbtn{flex:none;min-height:44px;padding:0 14px 0 8px;font-size:15px;box-shadow:2px 2px 0 var(--ink);background:var(--sun)}
.vbtn.playing{background:var(--leaf);color:var(--card)}
.vbtn svg{width:22px;height:22px}
.agerow{display:flex;flex-wrap:wrap;gap:8px}
.ageopt{position:relative;cursor:pointer}
.ageopt input{position:absolute;opacity:0;pointer-events:none}
.ageopt span{display:grid;place-items:center;width:52px;height:52px;border:3px solid var(--ink);border-radius:14px;background:var(--card);font:700 22px var(--display);font-variant-numeric:tabular-nums}
.ageopt span.wide{width:auto;padding:0 12px;grid-auto-flow:column;gap:6px;font-size:20px}
.ageopt span.wide small{font:600 14px var(--display);color:var(--ink-soft)}
.ageopt input:checked+span{background:var(--sun);box-shadow:0 0 0 3px var(--coral)}
.ageopt input:focus-visible+span{outline:4px solid var(--sky);outline-offset:3px}
.agehint{margin:0;font-size:15px;color:var(--ink-soft);min-height:1.3em}
.mhead{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:10px 0 -4px}
.mhead h3{font:700 24px var(--display);margin:0;background:var(--c);border:3px solid var(--ink);border-radius:999px;padding:4px 18px}
.mhead span{color:var(--ink-soft);font:600 16px var(--display);font-variant-numeric:tabular-nums}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes shake{20%{transform:translateX(-7px) rotate(-4deg)}40%{transform:translateX(7px) rotate(4deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes say{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
@media (max-width:460px){.zones{grid-template-columns:1fr 1fr}.zone{min-height:170px}.bubble p{font-size:17px}.ana{width:64px}}
</style>

const tl=(k,l)=>{const v=S[k];let r=v?v[l]:k;if(typeof r==='string')r=r.replace(/\{name\}/g,myName());return r};
const other=()=>state.lang==='en'?'ms':'en';
const bi=k=>`${tl(k,state.lang)}<span class="tr" lang="${other()==='ms'?'ms':'en'}">${tl(k,other())}</span>`;

let AC=null;
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
/* ---------- music: a small step sequencer ---------- */
const mtof=m=>440*Math.pow(2,(m-69)/12);
const MEL=[[72,0,76,79,76,0,74,72],[74,0,79,0,77,76,74,0],[72,0,76,81,79,0,76,0],[77,76,74,72,74,0,0,0],
 [79,0,76,0,72,74,76,0],[74,76,79,0,83,0,79,0],[81,0,79,76,74,0,72,0],[74,0,76,0,72,0,0,0]];
const BASS=[48,43,45,41],CHORD=[[60,64,67],[59,62,67],[57,60,64],[57,60,65]];
const Music={on:false,step:0,next:0,timer:null,mode:'hub',gain:null,noise:null};
function mNote(f,t,dur,type,vol,att){const c=AC,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(att||.012));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(Music.gain);o.start(t);o.stop(t+dur+.05)}
function mKick(t){const c=AC,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g).connect(Music.gain);o.start(t);o.stop(t+.2)}
function mShake(t,v){const c=AC;if(!Music.noise){const b=c.createBuffer(1,c.sampleRate*.1,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;Music.noise=b}const n=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();n.buffer=Music.noise;f.type='highpass';f.frequency.value=6000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);n.connect(f).connect(g).connect(Music.gain);n.start(t);n.stop(t+.07)}
function mStep(i,t,spb){
 const bar=Math.floor(i/8)%8,s=i%8,ch=bar%4,m=MEL[bar][s],hub=Music.mode==='hub';
 if(s===0)CHORD[ch].forEach(n=>mNote(mtof(n),t,spb*8,'sine',hub?.06:.08,.25));
 if(s===0||s===4)mNote(mtof(BASS[ch]),t,spb*1.8,'sine',hub?.45:.3);
 if(hub){if(s===6)mNote(mtof(BASS[ch]+7),t,spb*1.2,'sine',.3);if(m)mNote(mtof(m),t,spb*1.5,'triangle',.22);if(s===0||s===4)mKick(t);if(s%2)mShake(t,.12)}
 else{if(m&&s%2===0)mNote(mtof(m+12),t,spb*3.5,'sine',.13);if(s%4===2)mShake(t,.05)}
}
function mSched(){if(!Music.on||!AC)return;const spb=60/(Music.mode==='hub'?112:92)/2;while(Music.next<AC.currentTime+.15){mStep(Music.step,Music.next,spb);Music.next+=spb;Music.step=(Music.step+1)%64}}
function mStart(){if(Music.on||!state.music)return;try{const c=ac();if(!Music.gain){Music.gain=c.createGain();Music.gain.gain.value=0;Music.gain.connect(c.destination)}Music.gain.gain.cancelScheduledValues(c.currentTime);Music.gain.gain.setTargetAtTime(.32,c.currentTime,.5);Music.on=true;Music.step=0;Music.next=c.currentTime+.08;Music.timer=setInterval(mSched,25)}catch(e){}}
function mStop(){if(!Music.on)return;Music.on=false;clearInterval(Music.timer);try{Music.gain.gain.cancelScheduledValues(AC.currentTime);Music.gain.gain.setTargetAtTime(0,AC.currentTime,.12)}catch(e){}}
function mMode(m){Music.mode=m}

function scoreVoice(v){const l=(v.lang||'').toLowerCase().replace('_','-'),n=v.name||'';let sc=0;
 if(state.lang==='ms'){if(l.startsWith('ms'))sc+=100;else if(l.startsWith('id'))sc+=55;else return -1}
 else{if(!l.startsWith('en'))return -1;sc+=100;if(/en-(gb|au|ie|nz)/.test(l))sc+=6}
 if(/natural|neural|online|enhanced|premium/i.test(n))sc+=40;

 if(/aria|jenny|ana\b|sonia|libby|maisie|emma|ava\b|samantha|karen|moira|tessa|serena|kate|female|yasmin|gadis|clara|natasha|siri/i.test(n))sc+=15;

const GAMES={};

 stage.innerHTML=`<canvas width="${W}" height="${H}" tabindex="0" aria-label="${t('room.xray')}"></canvas>`;
 const cv=stage.querySelector('canvas'),ctx=cv.getContext('2d');

 setChips(T.map(o=>o.id));say(tm('xray'),true);
 const R=big?64:84,tol=big?30:42;
 let lx=548,ly=350,touched=false,active=true,raf,done=false;
 bindPointer(cv,{down:(x,y)=>{lx=x;ly=y;touched=true},move:(x,y,d,pt)=>{if(d||pt==='mouse'){lx=x;ly=y;touched=true}}});
 cv.addEventListener('keydown',e=>{const k={ArrowLeft:[-14,0],ArrowRight:[14,0],ArrowUp:[0,-14],ArrowDown:[0,14]}[e.key];if(k){lx=Math.max(0,Math.min(W,lx+k[0]));ly=Math.max(0,Math.min(H,ly+k[1]));touched=true;e.preventDefault()}});
 function draw(now){
  ctx.drawImage(normal,0,0);
  T.forEach(o=>{if(o.found){ctx.save();starPath(ctx,o.x+26,o.y-24,13);ctx.fillStyle=SUN;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();ctx.restore()}});
  // handle
  const ha=Math.PI/4;ctx.lineCap='round';ctx.strokeStyle=INK;ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(lx+Math.cos(ha)*R,ly+Math.sin(ha)*R);ctx.lineTo(lx+Math.cos(ha)*(R+44),ly+Math.sin(ha)*(R+44));ctx.stroke();ctx.strokeStyle=SKY;ctx.lineWidth=8;ctx.stroke();
  ctx.save();ctx.beginPath();ctx.arc(lx,ly,R,0,7);ctx.clip();ctx.drawImage(xr,0,0);
  T.forEach(o=>{if(o.found){ctx.beginPath();ctx.arc(o.x,o.y,24,0,7);ctx.lineWidth=3;ctx.strokeStyle=SUN;ctx.stroke()}});ctx.restore();
  ctx.beginPath();ctx.arc(lx,ly,R,0,7);ctx.lineWidth=8;ctx.strokeStyle=INK;ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle=SKY;ctx.stroke();

 }

  $('#controls').innerHTML=`<button class="cta ok" id="qOk">${t('qa.ok')}</button><button class="cta" id="qFix">${t('qa.fix')}</button>`;
  const nd=stage.querySelector('#needle');let cur=100,busy=false;

  async function show(){const r=reads[i];stage.querySelector('#qn').textContent=`${i+1} / 2`;const from=cur;await tween(700,p=>{cur=from+(r.v-from)*p+Math.sin(p*20)*(1-p)*1.2;setV(cur)});cur=r.v;setV(cur);busy=false}

  function draw(now){
   ctx.fillStyle='#EEF5F3';ctx.fillRect(0,0,W,H);ctx.fillStyle='#DDEAE6';ctx.fillRect(0,394,W,46);
   ctx.beginPath();ctx.arc(ISO.x,ISO.y,GR,0,7);ctx.lineWidth=34;ctx.strokeStyle='#D3E0DC';ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(ISO.x,ISO.y,GR+17,0,7);ctx.stroke();ctx.beginPath();ctx.arc(ISO.x,ISO.y,GR-17,0,7);ctx.stroke();
   const bx=ISO.x+ox,by=ISO.y+oy;
   ctx.fillStyle='#7C8C8A';ctx.fillRect(bx-26,by+96,52,H-(by+96));ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.strokeRect(bx-26,by+96,52,H-(by+96));
   ctx.fillStyle=SKY;ctx.beginPath();ctx.roundRect?ctx.roundRect(bx-185,by+78,370,20,8):ctx.rect(bx-185,by+78,370,20);ctx.fill();ctx.stroke();
   ell(ctx,bx,by,140,86,0,'#F0C39E',4);
   const[tx,ty]=spots[round]||[0,0];
   if(big){ell(ctx,bx-58,by-4,48,54,0,'#F7D4D0',2.5);ell(ctx,bx+58,by-4,48,54,0,'#F7D4D0',2.5);
    ctx.beginPath();const hx=bx+8,hy=by+14;ctx.moveTo(hx,hy+22);ctx.bezierCurveTo(hx-34,hy,hx-22,hy-26,hx,hy-12);ctx.bezierCurveTo(hx+22,hy-26,hx+34,hy,hx,hy+22);ctx.fillStyle='#E05A4D';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.stroke();
    circ(ctx,bx,by+66,12,'#fff',2.5);}
   else{ell(ctx,bx,by-8,70,40,0,'rgba(255,255,255,.18)');}
   traces.forEach(a=>beam(a,.2,12,18));
   if(beamOn)beam(gA,.25+.45*Math.sin(beamP*Math.PI),12,18);
   const tp={x:bx+tx,y:by+ty},r=22*tS;
   blob(tp.x,tp.y,r,now);ctx.fillStyle='#8E5BD6';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
   if(r>9){circ(ctx,tp.x-r*.35,tp.y-r*.15,r*.13,INK);circ(ctx,tp.x+r*.35,tp.y-r*.15,r*.13,INK);ctx.beginPath();if(happy)ctx.arc(tp.x,tp.y+r*.1,r*.32,.15*Math.PI,.85*Math.PI);else ctx.arc(tp.x,tp.y+r*.55,r*.3,1.15*Math.PI,1.85*Math.PI);ctx.lineWidth=2.5;ctx.stroke()}
   ctx.setLineDash([10,7]);ctx.lineWidth=2.5;ctx.strokeStyle=aligned?LEAF:'#22B36E';ctx.beginPath();ctx.moveTo(0,ISO.y);ctx.lineTo(W,ISO.y);ctx.moveTo(ISO.x,0);ctx.lineTo(ISO.x,H);ctx.stroke();ctx.setLineDash([]);
   ctx.lineWidth=4;ctx.strokeStyle=LEAF;ctx.beginPath();ctx.arc(ISO.x,ISO.y,10,0,7);ctx.stroke();
   if(aligned&&!big&&!firing){const p=(now%1000)/1000;ctx.beginPath();ctx.arc(ISO.x,ISO.y,30+p*20,0,7);ctx.lineWidth=4;ctx.strokeStyle=`rgba(255,197,61,${1-p})`;ctx.stroke()}
   ctx.save();ctx.translate(ISO.x+GR*Math.sin(gA),ISO.y-GR*Math.cos(gA));ctx.rotate(gA);ctx.fillStyle='#fff';ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.beginPath();ctx.roundRect?ctx.roundRect(-40,-30,80,46,10):ctx.rect(-40,-30,80,46);ctx.fill();ctx.stroke();ctx.fillStyle=INK;ctx.fillRect(-16,12,32,10);if(beamOn){circ(ctx,0,22,6,SUN)}ctx.restore();
  }
  newPatient();
  const loop=n=>{if(!active)return;draw(n);raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop);
 }
 return{stop(){active=false;cancelAnimationFrame(raf)}};
};

/* ---------- voice picker ---------- */
function voicePicker(){
 const list=rankedVoices().slice(0,8),cur=state.voice[state.lang]||'';
 const row=(uri,label,sub)=>`<label class="vrow"><input type="radio" name="vp" id="vp-${btoa(unescape(encodeURIComponent(uri||'auto'))).replace(/[^a-z0-9]/gi,'')}" value="${uri.replace(/"/g,'&quot;')}" ${uri===cur?'checked':''}><span class="vname">${label}<small>${sub}</small></span><button type="button" class="vtest" data-uri="${uri.replace(/"/g,'&quot;')}">${t('voiceTest')}</button></label>`;
 const o=overlay(`<h2>${t('voiceT')}</h2>${list.length?`<p style="color:var(--ink-soft)">${t('voiceHint')}</p><div class="vlist">${row('',t('voiceAuto'),list[0]?list[0].name:'')}${list.map(v=>row(v.voiceURI,v.name.replace(/^(Microsoft|Google)\s+/,''),v.lang)).join('')}</div>`:`<p>${t('voiceNone')}</p>`}<div class="row"><button class="cta" id="vDone">${t('done')}</button></div>`);
 o.querySelectorAll('input[name=vp]').forEach(r=>r.onchange=()=>{state.voice[state.lang]=r.value;save();const v=r.value?VOICES.find(x=>x.voiceURI===r.value):null;speak(t('voiceSample'),null,true,v)});
 o.querySelectorAll('.vtest').forEach(b=>b.onclick=e=>{e.preventDefault();const u=b.dataset.uri;const v=u?VOICES.find(x=>x.voiceURI===u):null;speak(t('voiceSample'),null,true,v)});
 o.querySelector('#vDone').onclick=closeOverlay;
}
/* ---------- NUCLEAR MEDICINE ---------- */
GAMES.nm=function(stage){
 const big=state.mode==='big';let active=true,raf,calWrong=0;
 const PSKIN='#E9B98F',GOWN='#9FD0EC';
 function patient(x){
  x.fillStyle='#F4FAF8';x.fillRect(0,0,W,H);x.strokeStyle='#E1EEE9';x.lineWidth=2;for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let j=0;j<H;j+=40){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
  x.lineCap='round';
  const limb=(x1,y1,x2,y2,w,c)=>{x.strokeStyle=INK;x.lineWidth=w+8;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();x.strokeStyle=c;x.lineWidth=w;x.stroke()};
  limb(296,290,288,410,34,PSKIN);limb(344,290,352,410,34,PSKIN);
  limb(262,140,214,262,28,PSKIN);limb(378,140,426,262,28,PSKIN);
  limb(262,140,240,196,34,GOWN);limb(378,140,400,196,34,GOWN);
  x.fillStyle=GOWN;x.strokeStyle=INK;x.lineWidth=4;x.beginPath();x.moveTo(258,128);x.lineTo(382,128);x.lineTo(392,300);x.lineTo(248,300);x.closePath();x.fill();x.stroke();
  x.strokeStyle='#7FB9DA';x.lineWidth=3;[[270,160],[340,210],[300,250],[360,270]].forEach(([a,b])=>{circ(x,a,b,5,'#C9E6F5')});
  x.fillStyle=PSKIN;x.fillRect(306,104,28,28);x.strokeStyle=INK;x.lineWidth=4;x.strokeRect(306,104,28,28);
  circ(x,320,72,42,PSKIN,4);x.fillStyle='#3A2A22';x.beginPath();x.arc(320,66,44,Math.PI*1.05,Math.PI*1.95);x.fill();
  circ(x,305,76,4.5,INK);circ(x,335,76,4.5,INK);x.strokeStyle=INK;x.lineWidth=3;x.beginPath();x.arc(320,88,10,.15*Math.PI,.85*Math.PI);x.stroke();
  x.fillStyle='#fff';x.strokeStyle=INK;x.lineWidth=3;x.save();x.translate(414,232);x.rotate(-.42);x.fillRect(-16,-11,32,22);x.strokeRect(-16,-11,32,22);x.restore();
 }
 const base=mk(),bx=base.getContext('2d');patient(bx);
 const HOT=[{id:'crack',x:418,y:236,n:220,sd:9,str:1},{id:'kidney',x:320,y:200,n:300,sd:9,str:1,pair:true},{id:'bladder',x:320,y:282,n:320,sd:11,str:1.2}];
 const body=[];
 const inBody=(px,py)=>{if(Math.hypot(px-320,py-72)<40)return true;if(px>262&&px<378&&py>130&&py<298)return true;const seg=(x1,y1,x2,y2,r)=>{const vx=x2-x1,vy=y2-y1,t2=Math.max(0,Math.min(1,((px-x1)*vx+(py-y1)*vy)/(vx*vx+vy*vy)));return Math.hypot(px-(x1+t2*vx),py-(y1+t2*vy))<r};return seg(296,290,288,410,16)||seg(344,290,352,410,16)||seg(262,140,214,262,13)||seg(378,140,426,262,13)};
 while(body.length<1400){const px=180+Math.random()*280,py=28+Math.random()*390;if(inBody(px,py))body.push([px,py,0])}
 const g=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
 HOT.forEach(h=>{for(let i=0;i<h.n;i++){const dx=h.pair?(i%2?-22:22):0;body.push([h.x+dx+g()*h.sd,h.y+g()*h.sd*(h.pair?1.5:1),1])}});
 setChips(HOT.map(h=>h.id));
 let phase='prep',A=1,t0=0,camX=548,camY=120,touched=false,done=false,dwell=null;
 const R=big?62:78,need=big?1.3:.45;
 stage.innerHTML=`<canvas width="${W}" height="${H}" tabindex="0" aria-label="${t('room.nm')}"></canvas>`;
 const cv=stage.querySelector('canvas'),ctx=cv.getContext('2d');
 bindPointer(cv,{down:(x,y)=>{if(phase==='scan'){camX=x;camY=y;touched=true}},move:(x,y,d,pt)=>{if(phase==='scan'&&(d||pt==='mouse')){camX=x;camY=y;touched=true}}});
 cv.addEventListener('keydown',e=>{const k={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-12],ArrowDown:[0,12]}[e.key];if(k&&phase==='scan'){camX=Math.max(0,Math.min(W,camX+k[0]));camY=Math.max(0,Math.min(H,camY+k[1]));touched=true;e.preventDefault()}});
 let glowT=0;
 function giveBtn(){
  $('#controls').innerHTML=`<button class="cta ready" id="nmGive">${t('nm.give.'+(big?'big':'little'))}</button>`;
  $('#nmGive').onclick=async()=>{ $('#controls').innerHTML='';sfx('zap');say(t('nm.giving'),true);phase='giving';const s0=performance.now();
   await tween(1600,p=>glowT=p);phase='scan';t0=performance.now();sfx('good');say(tm('nm.scan'),true);
   if(big)$('#controls').innerHTML=`<div class="readout" style="min-width:16ch"><span>${t('nm.left')}</span>: <b id="nmA">100%</b></div><div class="bar"><i id="nmBar" style="width:100%;background:${LEAF}"></i></div>`; };
 }
 function calib(){
  const reads=shuffle([{v:405,ok:true},{v:560,ok:false}]);let i=0,busy=false;
  say(tm('nm')+' '+t('nm.cal'),false);
  stage.innerHTML=`<div class="qa"><svg viewBox="0 0 380 200" role="img" aria-label="${t('nm.calLabel')}"><rect x="20" y="20" width="200" height="160" rx="18" fill="#E9EEF1" stroke="${INK}" stroke-width="4"/><rect x="40" y="44" width="160" height="56" rx="8" fill="#0E2233" stroke="${INK}" stroke-width="3"/><text id="calTxt" x="120" y="83" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="30" fill="${LEAF}">--- MBq</text><text x="120" y="130" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="600" font-size="15" fill="${INK}">${t('nm.calLabel')}</text><circle cx="120" cy="160" r="9" fill="${SUN}" stroke="${INK}" stroke-width="2.5"/><g transform="translate(250 40) rotate(15)"><rect x="18" y="0" width="28" height="110" rx="6" fill="#fff" stroke="${INK}" stroke-width="4"/><rect x="22" y="40" width="20" height="66" rx="3" fill="${LEAF}" opacity=".55"/><rect x="10" y="-10" width="44" height="12" rx="4" fill="${INK}"/><rect x="29" y="110" width="6" height="34" fill="${INK}"/><rect x="0" y="40" width="64" height="70" rx="10" fill="none" stroke="#7D8C93" stroke-width="5" stroke-dasharray="4 5"/></g></svg><div class="readout">${t('nm.ask')}</div><p class="left" id="calN"></p></div>`;
  $('#controls').innerHTML=`<button class="cta ok" id="cOk">${t('nm.ok')}</button><button class="cta" id="cFix">${t('nm.fix')}</button>`;
  const txt=stage.querySelector('#calTxt');
  async function show(){busy=true;stage.querySelector('#calN').textContent=`${i+1} / 2`;const r=reads[i];await tween(800,p=>{txt.textContent=Math.round(r.v*p+Math.random()*30*(1-p))+' MBq'});txt.textContent=r.v+' MBq';busy=false}
  async function answer(saysOk){if(busy)return;busy=true;const r=reads[i];
   if(saysOk!==r.ok){calWrong++;sfx('bad');say(t('nm.bad'));busy=false;return}
   sfx('good');say(t(r.ok?'nm.goodOk':'nm.goodFix'));if(!r.ok){await tween(700,p=>{txt.textContent=Math.round(560+(398-560)*p)+' MBq'})}
   await wait(1700);if(!active)return;i++;if(i<reads.length)show();else{setupCanvas();}}
  $('#cOk').onclick=()=>answer(true);$('#cFix').onclick=()=>answer(false);show();
 }
 function setupCanvas(){
  stage.innerHTML='';stage.appendChild(cv);say(big?t('nm.afterCal'):tm('nm'),big);giveBtn();loop0();
 }
 function draw(now){
  ctx.drawImage(base,0,0);
  if(phase==='giving'||phase==='scan'){const a=phase==='giving'?glowT:Math.max(0,.35*A);ctx.save();ctx.globalAlpha=.25*a;ctx.fillStyle=LEAF;body.forEach(([px,py],k)=>{if(k%4===0)ctx.fillRect(px-2,py-2,4,4)});ctx.restore()}
  HOT.forEach(h=>{if(h.found){ctx.save();starPath(ctx,h.x+(h.pair?40:24),h.y-22,12);ctx.fillStyle=SUN;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();ctx.restore()}});
  if(phase!=='scan')return;
  if(big){A=Math.pow(.5,(now-t0)/1000/25);const pa=$('#nmA'),pb=$('#nmBar');if(pa)pa.textContent=Math.round(A*100)+'%';if(pb)pb.style.width=(A*100)+'%'}
  // camera view
  const s=R;ctx.save();ctx.beginPath();ctx.rect(camX-s,camY-s,2*s,2*s);ctx.clip();ctx.fillStyle='#070A18';ctx.fillRect(camX-s,camY-s,2*s,2*s);
  const frac=Math.max(.08,A);
  for(const [px,py,hot] of body){if(Math.abs(px-camX)>s+3||Math.abs(py-camY)>s+3)continue;if(Math.random()>frac*(hot?.85:.35))continue;ctx.fillStyle=hot?(Math.random()<.5?'#FFF6B0':'#9BFFB8'):'#3FA36B';ctx.fillRect(px-1.4+Math.random()*1.4,py-1.4+Math.random()*1.4,2.6,2.6)}
  ctx.restore();
  ctx.lineWidth=10;ctx.strokeStyle=INK;ctx.strokeRect(camX-s,camY-s,2*s,2*s);ctx.lineWidth=4;ctx.strokeStyle='#CDBDF2';ctx.strokeRect(camX-s,camY-s,2*s,2*s);
  ctx.fillStyle=INK;ctx.fillRect(camX-s-6,camY-s-26,2*s+12,20);ctx.fillStyle='#CDBDF2';ctx.font='600 13px Fredoka, sans-serif';ctx.textAlign='center';ctx.fillText(big?'GAMMA CAMERA':'CAMERA',camX,camY-s-11);
  if(!touched){const p2=(now%1200)/1200;ctx.strokeStyle=`rgba(242,107,79,${1-p2})`;ctx.lineWidth=4;ctx.strokeRect(camX-s-8-p2*16,camY-s-8-p2*16,2*s+16+p2*32,2*s+16+p2*32)}
  // dwell detection
  const tol=big?26:40;let over=null;HOT.forEach(h=>{if(!h.found&&Math.abs(h.x-camX)<tol&&Math.abs(h.y-camY)<tol)over=h});
  if(over&&touched&&!done){if(!dwell||dwell.h!==over)dwell={h:over,t:now};const need2=need/Math.max(.25,A),pr=Math.min(1,(now-dwell.t)/1000/need2);
   ctx.lineWidth=7;ctx.strokeStyle=SUN;ctx.beginPath();ctx.arc(camX,camY,22,-Math.PI/2,-Math.PI/2+pr*Math.PI*2);ctx.stroke();
   if(big){ctx.fillStyle='#fff';ctx.font='600 14px Fredoka, sans-serif';ctx.fillText(t('nm.counts')+' '+Math.round(pr*100)+'%',camX,camY+s-10)}
   if(pr>=1){over.found=true;dwell=null;sfx('find');gotChip(over.id);say(t('f.'+(over.id==='crack'?'arm':over.id)),true);
    if(HOT.every(q=>q.found)){done=true;const acc=big?Math.max(0,Math.min(1,A/.5))*(1-.25*calWrong):1;setTimeout(()=>finish('nm',acc),400)}}}
  else dwell=null;
 }
 function loop0(){const loop=n=>{if(!active)return;draw(n);raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop)}
 if(big)calib();else setupCanvas();
 return{stop(){active=false;cancelAnimationFrame(raf)}};
};

renderHub();
if(!me())playerPicker();
