<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A 20-minute stereotactic radiotherapy explorace for science camp teams, in English and Bahasa Melayu.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Beam On! Explorace Quick Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: linac-console bar (team, countdown, score) pinned on top, the five-room patient pathway as a strip, one station card below.
   Single committed light look shared with Beam On!: clinical paper, console slate, beam-on amber, laser red for alignment. */
:root{
  --ink:#16212A; --ink-2:#4B5963; --ink-3:#6A7780;
  --paper:#EDF1F3; --panel:#FFFFFF; --line:#D2DBE0; --sunk:#F5F8F9;
  --amber:#E8961A; --amber-soft:#FFF1D9; --amber-ink:#7A4A00;
  --laser:#E0312B; --good:#1F7F55; --good-soft:#E3F4EA;
  --danger:#C23B3B; --danger-soft:#FBE7E7;
  --phys:#137F8E; --phys-soft:#E0F2F4;
  --console:#1D2B35; --console-ink:#E9F1F4; --console-dim:#9FB3BD;
  --font-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--font-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--console)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--phys);outline-offset:2px}
.app{max-width:820px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}

/* console bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--console);color:var(--console-ink);border-radius:0 0 14px 14px;padding:10px 14px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.lamp{width:28px;height:28px;border-radius:7px;background:#3A4A55;display:grid;place-items:center;flex:none;transition:background .3s,box-shadow .3s}
.lamp span{width:9px;height:9px;border-radius:50%;background:#9FB3BD}
.lamp.on{background:var(--amber);box-shadow:0 0 0 3px rgba(232,150,26,.25),0 0 18px rgba(232,150,26,.6)}
.lamp.on span{background:#FFF6E5}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.02em;margin:0;line-height:1}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--console-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--console-dim);font-weight:700}
.stat span{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
#clock{font-size:28px;line-height:1}
#clock.warn{color:var(--amber)}
#clock.crit{color:#FF7A6E;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}

/* pathway strip */
.path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;list-style:none;margin:0;padding:0}
.path li{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 6px 7px;display:grid;justify-items:center;gap:3px;text-align:center;min-width:0;position:relative}
.path li svg{width:28px;height:28px;color:var(--ink-3)}
.path li b{font-family:var(--font-display);font-size:13px;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.path li i{font-style:normal;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.path li.now{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.path li.now svg{color:var(--amber-ink)}
.path li.done{background:var(--good-soft);border-color:var(--good)}
.path li.done svg{color:var(--good)}
@media (max-width:460px){.path li b{font-size:11px}.path li svg{width:22px;height:22px}}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.card h2{font-family:var(--font-display);font-size:clamp(22px,5vw,28px);line-height:1.1;margin:0;text-wrap:balance}
.card h3{font-family:var(--font-display);font-size:18px;margin:0;text-wrap:balance}
.card p{margin:0}
.eyebrow{font-family:var(--font-display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--phys);font-weight:700}
.eyebrow.amber{color:var(--amber-ink)}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.mission{background:var(--console);color:var(--console-ink);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.mission .eyebrow{color:var(--amber)}
.mission ol{margin:0;padding-left:20px;display:grid;gap:4px}
.section{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:12px}

.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700;font-size:15px;min-height:44px}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn.primary{background:var(--console);border-color:var(--console);color:var(--console-ink)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#2A1A00}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btnrow.end{justify-content:flex-end}

.q{display:grid;gap:8px}
.q p.ask{font-weight:700}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 13px;cursor:pointer;font-size:15px;min-height:44px}
.opt:hover:not(:disabled){border-color:var(--phys);background:var(--phys-soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt.sel{border-color:var(--phys);background:var(--phys-soft)}
.why{background:var(--sunk);border-left:4px solid var(--phys);border-radius:0 10px 10px 0;padding:9px 12px;font-size:14.5px}
.flag{border-radius:10px;padding:10px 13px;font-size:14.5px}
.flag.good{background:var(--good-soft);color:#14583A}
.flag.bad{background:var(--danger-soft);color:#8C2424}
.flag.warn{background:var(--amber-soft);color:var(--amber-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.chip.good{background:var(--good-soft);color:var(--good)}

/* patient + plan cards */
.pt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--sunk);border-radius:12px;padding:12px}
.pt svg{width:72px;height:72px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font-size:14px}
.kv dt{color:var(--ink-3);font-weight:700}
.kv dd{margin:0;font-family:var(--font-mono);font-size:13.5px;overflow-wrap:anywhere}
.plans{display:grid;gap:8px}
.plan{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:2px}
.plan b{font-family:var(--font-display);font-size:15px}
.plan span{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2)}
.plan.right{border-color:var(--good);background:var(--good-soft)}
.plan.wrong{border-color:var(--danger);background:var(--danger-soft)}

/* alignment panels */
.views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.view{background:#0F1A21;border-radius:12px;padding:6px;display:grid;gap:4px;min-width:0}
.view svg{width:100%;height:auto;display:block;max-width:100%}
.view small{color:#9FB3BD;font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-align:center;font-weight:700}
.pad{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.axis{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:6px}
.axis b{font-size:13px;color:var(--ink-2)}
.axis .row{display:flex;gap:6px}
.axis .row button{flex:1;min-height:44px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-family:var(--font-mono);font-weight:700;font-size:14px}
.axis .row button:active{background:var(--sunk)}
.readout{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2)}

/* planning */
.planner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,240px);gap:14px;align-items:start}
@media (max-width:640px){.planner{grid-template-columns:minmax(0,1fr)}}
.ctwrap{background:#0B1318;border-radius:12px;padding:6px;max-width:100%}
.ctwrap canvas{display:block;width:100%;height:auto;aspect-ratio:1;max-width:100%;border-radius:8px;touch-action:manipulation;cursor:pointer}
.angles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.angles button{min-height:44px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-family:var(--font-mono);font-weight:700;font-size:13px}
.angles button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#2A1A00}
.dvh{display:grid;gap:6px}
.dvh div{display:grid;grid-template-columns:96px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:13px}
.dvh .bar{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;position:relative}
.dvh .bar i{display:block;height:100%;background:var(--good);border-radius:5px}
.dvh .bar i.over{background:var(--danger)}
.dvh .bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.dvh span{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}

/* checklist */
.checks{display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
.check input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--phys)}
.check.right{border-color:var(--good);background:var(--good-soft)}
.check.wrong{border-color:var(--danger);background:var(--danger-soft)}
.check.missed{border-color:var(--amber);background:var(--amber-soft)}

/* beam on */
.beam{display:grid;gap:10px;justify-items:center;text-align:center;background:#0F1A21;color:var(--console-ink);border-radius:14px;padding:18px}
.mu{font-family:var(--font-mono);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.mu small{font-size:16px;color:var(--console-dim);margin-left:6px}
.beambtn{width:150px;height:150px;border-radius:50%;border:6px solid #3A4A55;background:#2A3A45;color:var(--console-ink);font-family:var(--font-display);font-weight:700;font-size:20px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;transition:background .15s,box-shadow .15s}
.beambtn.hot{background:var(--amber);color:#2A1A00;border-color:#FFD48A;box-shadow:0 0 0 8px rgba(232,150,26,.25),0 0 40px rgba(232,150,26,.6)}
.beambtn:disabled{opacity:.4;cursor:not-allowed}
.mubar{width:min(320px,100%);height:10px;border-radius:5px;background:#2A3A45;overflow:hidden}
.mubar i{display:block;height:100%;background:var(--amber);width:0}

/* signoff */
.signoff{background:var(--amber-soft);border-radius:12px;padding:14px;display:grid;gap:10px}
.signoff.done{background:var(--good-soft)}
.stars{display:flex;gap:6px}
.stars button{width:48px;height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;display:grid;place-items:center}
.stars button svg{width:26px;height:26px}
.stars button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber)}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:700;color:var(--ink-2)}
.field input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-height:44px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.row2{grid-template-columns:minmax(0,1fr)}}
.err{margin:0;min-height:1.2em;color:var(--danger);font-size:14px;font-weight:700}

/* results */
.score{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--font-display);font-size:clamp(44px,12vw,72px);font-weight:700;line-height:1}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
.hero{display:grid;gap:10px}
.hero h2{font-size:clamp(30px,8vw,46px)}
.foot{font-size:13px;color:var(--ink-3);text-align:center}
.foot a{color:var(--phys)}
.linkbtn{border:0;background:none;padding:0;color:var(--phys);font-weight:700;cursor:pointer;text-decoration:underline;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(14,22,28,.6);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal .card{max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px}
.mrow{display:grid;gap:5px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--sunk)}
.rolebtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.rolebtns button{min-height:40px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-size:12.5px;font-weight:700;line-height:1.15;padding:4px;color:var(--ink-2)}
.rolebtns button[aria-pressed="true"]{background:var(--phys);border-color:var(--phys);color:#fff}
.lead{font-size:14.5px;color:var(--ink-2);margin:4px 0 0}
.lead b{color:var(--ink)}
.names input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-height:44px;min-width:0}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.roster li{background:var(--phys-soft);color:#0E525C;border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px}
.btn.big{padding:14px 24px;font-size:18px}
.row-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tbl tr.me td{background:var(--amber-soft)}
.csv{width:100%;min-height:140px;font-family:var(--font-mono);font-size:12px;border:1.5px solid var(--line);border-radius:8px;padding:8px;background:var(--sunk);color:var(--ink)}
/* briefing */
.brief h2{font-size:clamp(24px,5.4vw,32px)}
.dots{display:inline-flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.past{background:var(--phys)}
.dots i.on{background:var(--amber);width:22px;border-radius:5px}
.brief-split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:640px){.brief-split{grid-template-columns:minmax(0,1fr)}}
.brief-txt{display:grid;gap:10px;min-width:0}
.brief p,.blist li,.glossary dd,.journey span{font-size:16.5px;max-width:62ch}
.blist{margin:0;padding-left:20px;display:grid;gap:8px}
.brief-fig{margin:0;background:#0F1A21;border-radius:12px;padding:10px;display:grid;gap:8px}
.brief-fig svg{width:100%;height:auto;display:block;max-width:100%}
.brief-fig figcaption{color:#C8D5DB;font-size:13.5px;line-height:1.4}
.glossary{margin:0;display:grid;gap:10px}
.glossary div{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:4px 16px;padding:10px 0;border-top:1px solid var(--line)}
.glossary div:first-child{border-top:0}
@media (max-width:560px){.glossary div{grid-template-columns:minmax(0,1fr)}}
.glossary dt{font-family:var(--font-display);font-weight:700;font-size:17px}
.glossary dd{margin:0;color:var(--ink-2)}
.journey{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.journey li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;background:var(--sunk);border-radius:10px;padding:10px 12px}
.journey li svg{width:32px;height:32px;color:var(--amber-ink)}
.journey b{display:block;font-family:var(--font-display);font-size:16px}
.journey span{color:var(--ink-2)}
.brief-nav{border-top:1px dashed var(--line);padding-top:14px}
/* briefing motion: every animation runs from a hidden start to the element's normal resting state,
   so with reduced motion (animations off) everything is simply shown */
.brief-body{display:grid;gap:14px;animation:cardIn .45s ease-out both}
.brief-body.from-left{animation-name:cardInL}
@keyframes cardIn{from{opacity:0;transform:translateX(32px)}}
@keyframes cardInL{from{opacity:0;transform:translateX(-32px)}}
.stag{animation:rise .55s ease-out both;animation-delay:calc(.15s + var(--d,0) * .14s)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(.35s + var(--d,0) * .12s)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.journey{position:relative}
.journey::before{content:"";position:absolute;left:31px;top:24px;bottom:24px;width:3px;border-radius:2px;background:var(--amber);transform-origin:top;animation:drawDown 1.1s .3s ease-out both}
.journey li{position:relative}
@keyframes drawDown{from{transform:scaleY(0)}}
.cf .cf-beam{transform-box:view-box;transform-origin:156px 100px;animation:cfBeam .7s ease-out both;animation-delay:calc(.6s + var(--i) * .45s)}
@keyframes cfBeam{from{opacity:0;transform:scale(.25)}}
.cf .cf-tum{transform-box:view-box;transform-origin:156px 100px;animation:cfHeat .9s 2.9s ease-in both,cfPulse 1.8s 3.8s ease-in-out infinite}
@keyframes cfHeat{from{fill:#E8961A}}
@keyframes cfPulse{50%{transform:scale(1.3)}}
.cf .cf-gantry{transform-box:view-box;transform-origin:156px 100px;animation:cfOrbit 7s linear infinite}
@keyframes cfOrbit{to{transform:rotate(360deg)}}
.dots i{transition:width .3s,background .3s}
.qinfo{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:14px;align-items:center;background:var(--sunk);border-radius:12px;padding:12px}
.qinfo h3{margin:4px 0}.qinfo p{margin:0}
@media (max-width:560px){.qinfo{grid-template-columns:minmax(0,1fr)}}
.tbl.mk tr.mkhead td{background:var(--sunk);padding-top:10px}
.yourturn{margin:0;background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:0 10px 10px 0;padding:10px 14px;font-weight:700}
/* staff demo */
.sdemo{display:grid;gap:10px;background:var(--amber-soft);border:2px solid var(--amber);border-radius:14px;padding:16px}
.sdemo p{margin:0;max-width:62ch}
.sdemo-clock{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sdemo-clock span{font:700 clamp(40px,10vw,64px)/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--amber-ink)}
.sdemo-clock small{font:700 13px var(--font-mono);color:var(--amber-ink);text-transform:uppercase;letter-spacing:.06em}
.sdemo-bar{height:8px;border-radius:4px;background:rgba(232,150,26,.25);overflow:hidden}
.sdemo-bar i{display:block;height:100%;background:var(--amber);transition:width .5s linear}

  {k:'journey',h:'MAX’s journey today',
   li:['Answer the doctor’s physics questions, then wheel MAX safely to the CT room.','Lock MAX on its base, line up the lasers and scan the head in the treatment position.','Choose many beam angles that hit the tumour and protect the eyes and brainstem.','Answer a physics check, clear the room and switch the beam on.']},
  {k:'rules',h:'How the race works',
   li:['You have {0} minutes from the moment you start the clock.','At each station: do the hands-on mission, answer the screen challenge, then call a staff member to sign you off.','The questions use the four physics ideas you just met. Look for the “From the briefing” link if you need a reminder.','Score: up to 60 for the screen, up to 30 for the staff member’s stars, plus a time bonus if MAX is treated.','Rules: walk, do not run. Handle MAX gently. Nobody stays in the bunker while the beam is on.','Every member has a role. At each station the screen shows who leads: the oncologist in the clinic, radiation therapists at CT and the linac, and medical physicists in planning and at the linac.']}

  st:{intro:['Intro','Introduction'],clinic:['Clinic','Oncology Clinic'],transport:['Transport','Patient Transport'],ct:['CT Sim','CT Simulator'],plan:['Planning','Treatment Planning'],linac:['Linac','Linac Treatment']},
  mission:{
   clinic:['Collect MAX from the waiting area and read the patient card.','Ask the staff member (your oncologist) to sign the request for CT planning.','Load MAX onto the trolley, face up, and wheel it to the CT room. Walk, and do not bump into walls, people or other teams.'],
   transport:['Load MAX onto the trolley, lying face up.','Push the trolley to the CT room. No bumping into walls, people or other teams.','Park with the brakes on and hand over to the CT radiographer (staff).'],
   ct:['Lock MAX onto its base so the head cannot move, not even by a millimetre.','Line up the lasers with the marks on MAX.','Scan MAX, then tell the staff member which area you scanned and why.'],
   plan:['Sit at the planning desk. Everyone in the team must agree on the plan.','Choose beam angles that hit the tumour and miss the eyes and brainstem.','Show the approved plan to the medical physicist (staff).'],
   linac:['Wheel MAX into the bunker and lock it onto the couch on its base.','Line up the lasers again, then everyone leaves the bunker.','Close the door and deliver the beam from the console.']},
  clinicQ:[
   {ask:'MAX is treated with 6 MV X-rays from a linac, not the low-energy X-rays used for a chest X-ray. Why?',opts:['They are cheaper to make','They reach deep into the head and give less dose to the skin','They make the tumour glow so it is easier to see','They are not ionising radiation'],
    why:'Megavoltage X-rays penetrate deeply, and their dose builds up a little below the surface. The tumour deep in the head gets the dose while the skin is spared.'},
   {ask:'The prescription is 30 Gy in 5 fractions. How much dose does MAX get at each treatment?',opts:['3 Gy','6 Gy','10 Gy','30 Gy'],
    why:'30 Gy divided by 5 treatments is 6 Gy each time, three times the usual 2 Gy. The gray (Gy) is one joule of energy absorbed per kilogram of tissue.'},
   {ask:'Stereotactic treatment gives a big dose in only 5 treatments instead of 30 small ones. What makes that safe?',opts:['The linac uses a weaker beam','The tumour is small and the beams are aimed to within 1 mm, so very little healthy brain gets the high dose','MAX is made of plastic, so nothing can go wrong','Each treatment is shorter'],
    why:'Stereotactic radiotherapy depends on precision: a rigid mask, image guidance and many beams converging on a small target. The high dose drops off steeply outside the tumour, so healthy brain is spared even with large fractions.'}],
  transport:['Wristband is on and matches the request form','Take the wristband off so it does not get dirty','Patient notes and CT request travel with the patient','Side rails up before moving','Run with the trolley to save time','Brakes on when parked and during transfer'],
  ctQ:[
   {ask:'Why do we plan radiotherapy on a CT scan rather than an ordinary photo or an MRI alone?',opts:['CT pictures look nicer','CT numbers tell the computer how dense each tissue is, so it can calculate dose','CT uses no radiation','MRI cannot see the head'],
    why:'Each CT voxel has a Hounsfield number linked to electron density. The planning system uses it to work out how the beam is absorbed. MRI is often added to see the tumour better.'},
   {ask:'How much of MAX should you scan?',opts:['Only the tumour, to keep the dose low','The whole head with a margin above and below','The whole body','Just one slice through the middle'],
    why:'The planner needs the tumour, every nearby organ at risk and the outline of the head so beams entering and leaving can be calculated.'}],
  linacQ:{ask:'MAX is normally 100 cm from the linac source. If MAX were moved to 200 cm, what would happen to the dose rate at the tumour?',opts:['It doubles','It stays the same','It halves','It drops to a quarter'],
   why:'Inverse square law: at twice the distance the same beam spreads over four times the area, so the dose rate falls to a quarter. That is why the distance to the patient is fixed and checked before every treatment.'},

 storyT:['Klinik','Ke CT','Imbasan CT','Perancangan','Rawatan','Selesai'],
 storyC:['MAX ada tumor otak. Pakar onkologi menetapkan radioterapi stereotaktik: 30 Gy dalam 5 fraksi.',
  'MAX dibawa ke bilik CT dengan troli. Berjalan, jangan berlari!',
  'Tapaknya mengunci MAX supaya tidak bergerak. Laser menyelaraskan kedudukannya, dan imbasan CT memetakan bahagian dalam kepalanya.',
  'Ahli fizik perubatan merancang alur yang bertemu pada tumor dan mengelak mata serta batang otak.',
  'Semua orang keluar dari bunker. Linac berputar mengelilingi MAX dan alur mengenai tumor dengan ketepatan 1 mm.',
  'Selepas lima rawatan 6 Gy, rawatan MAX selesai. Sekarang giliran kamu merawatnya!'],
 briefEyebrow:'Taklimat · baki {0} · masa perlumbaan belum bermula',back:'Kembali',next:'Seterusnya',skipBrief:'Langkau ke permulaan',
 brief:[
  {k:'rt',h:'Apakah radioterapi?',
   p:'Badan kita terdiri daripada sel-sel kecil. Kanser berlaku apabila sesetengah sel terus membesar walaupun sepatutnya berhenti, lalu membentuk ketulan yang dipanggil tumor. Radioterapi merawatnya dengan sinar-X: cahaya halimunan yang sama seperti untuk X-ray dada, tetapi dengan tenaga yang jauh lebih tinggi. Sinar-X memecahkan DNA di dalam sel. Sel kanser lemah membaiki kerosakan itu; sel sihat jauh lebih baik.',
   li:['MAX menerima radioterapi stereotaktik: banyak alur dari arah berbeza bertemu pada satu tumor kecil.','Di tempat alur bertindih, dosnya tinggi. Sejurus di luar tumor, dos jatuh dengan mendadak, jadi otak yang sihat menerima sangat sedikit.','Alur mesti dihalakan dengan ketepatan 1 mm, jadi MAX dipegang tidak bergerak dan disemak dengan imej sebelum setiap rawatan.','Rawatan ini tidak sakit, dan pesakit tidak menjadi radioaktif.'],
   cap:'Lihat mesin berputar mengelilingi kepala. Setiap alur sendirian lemah; di tempat semuanya bersilang, iaitu pada tumor, dos bertambah.'},
  {k:'team',h:'Pasukan di sebalik setiap rawatan',
   li:[['Pakar onkologi klinikal','Doktor yang memutuskan radioterapi sesuai untuk pesakit dan menetapkan dos.'],['Juru terapi sinaran','Membuat topeng, menjalankan imbasan CT perancangan dan memberi rawatan setiap hari.'],['Ahli fizik perubatan','Merancang alur, menyemak setiap pelan dan menguji linac supaya dos tepat hingga beberapa peratus.'],['Pesakit','MAX! Setiap semakan yang kamu buat hari ini adalah untuk keselamatan pesakit.']]},
  {k:'energy',tag:'Idea fizik 1 drp 4',h:'Mengapa linac guna sinar-X bertenaga tinggi',
   p:'Tenaga sinar-X diukur dalam volt. Mesin X-ray dada menggunakan kira-kira 100 ribu volt (100 kV). Linac menggunakan 6 juta volt (6 MV): enam puluh kali ganda.',
   li:['Sinar-X tenaga rendah kebanyakannya diserap dalam beberapa sentimeter pertama, jadi kebanyakan dosnya jatuh pada kulit.','Sinar-X tenaga tinggi bergerak jauh ke dalam kepala, jadi ia boleh sampai ke tumor di tengah.','Dosnya terbina sedikit di bawah permukaan, jadi kulit menerima kurang daripada tisu di bawahnya.'],
   cap:'Atas: sinar-X tenaga rendah pudar dekat kulit dan tidak sampai ke tumor. Bawah: sinar-X 6 MV menembusi jauh. Bentuk jingga menunjukkan dos yang diterima pada setiap kedalaman.'},
  {k:'dose',tag:'Idea fizik 2 drp 4',h:'Mengukur dos: gray',
   p:'Dos sinaran ialah tenaga yang diserap oleh badan daripada alur. Ia diukur dalam gray (Gy). 1 Gy bermaksud 1 joule tenaga diserap oleh setiap kilogram tisu.',
   li:['Doktor menetapkan jumlah dos dan membahagikannya kepada rawatan sama besar yang dipanggil fraksi, biasanya satu sehari.','Jumlah dos = dos setiap fraksi × bilangan fraksi. Contoh: 60 Gy dalam 30 fraksi ialah 2 Gy setiap hari, biasa untuk radioterapi biasa.','Rawatan stereotaktik menggunakan fraksi yang lebih besar, jadi hanya perlu beberapa hari rawatan.'],
   cap:'30 Gy MAX dibahagi sama rata kepada 5 hari rawatan. Berapa besar setiap bahagian? Kamu akan mengiranya di klinik.'},
  {k:'ct',tag:'Idea fizik 3 drp 4',h:'Melihat ke dalam: imbasan CT',
   p:'Pengimbas CT memutarkan tiub sinar-X mengelilingi pesakit dan membina gambar hirisan nipis badan. Setiap petak kecil dalam hirisan mendapat nombor CT yang menunjukkan ketumpatan tisu.',
   li:['Udara hitam (kira-kira −1000), tisu lembut kelabu (kira-kira 0) dan tulang putih (+1000 atau lebih).','Tisu yang lebih tumpat menyerap lebih banyak alur, jadi komputer perancangan menggunakan nombor ini untuk mengira dos.','Imbasan mesti meliputi seluruh kepala dan sedikit lagi: tumor, organ yang perlu dilindungi (mata, batang otak) dan garis luar kepala, tempat alur masuk dan keluar.'],
   cap:'Imbasan menyapu seluruh kepala dan sedikit jidar di luarnya. Setiap hirisan ialah peta ketumpatan.'},
  {k:'dist',tag:'Idea fizik 4 drp 4',h:'Jarak penting: hukum kuasa dua songsang',
   p:'Sinar-X tersebar dari linac seperti cahaya lampu suluh. Semakin jauh, semakin luas kawasan yang perlu diliputi oleh sinar-X yang sama, jadi setiap sentimeter persegi menerima kurang.',
   li:['Bergerak d kali lebih jauh dan alur meliputi d × d kali kawasan.','Contoh: 3 kali lebih jauh → 3 × 3 = 9 kali kawasan → setiap petak menerima 1/9 dos.','Sebab itu jarak dari sumber linac ke pesakit ditetapkan pada 100 cm dan disemak sebelum setiap rawatan.'],
   cap:'9 sinar-X yang sama jatuh pada 1 petak pada jarak 1 m, tetapi tersebar ke 9 petak pada jarak 3 m.'},
  {k:'journey',h:'Perjalanan MAX hari ini',
   li:['Jawab soalan fizik doktor, kemudian bawa MAX dengan selamat ke bilik CT.','Kunci MAX pada tapaknya, selaraskan laser dan imbas kepala dalam kedudukan rawatan.','Pilih banyak sudut alur yang mengenai tumor dan melindungi mata serta batang otak.','Jawab semakan fizik, kosongkan bilik dan hidupkan alur.']},
  {k:'rules',h:'Cara perlumbaan berjalan',

  const n=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();n.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;n.connect(f);f.connect(g);g.connect(tuneBus);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);n.start(t0);n.stop(t0+dur+.02)}
function tuneKick(t0){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t0);o.frequency.exponentialRampToValueAtTime(45,t0+.14);
  o.connect(g);g.connect(tuneBus);g.gain.setValueAtTime(.55,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+.18);o.start(t0);o.stop(t0+.2)}
function tuneSchedule(){const e=60/TUNE.bpm/2;
  while(tuneNext<AC.currentTime+.12){const i=tuneStep%64,bar=Math.floor(i/8),b=i%8,t0=tuneNext;
    const n=TUNE.lead[i];if(n){tuneVoice('square',midi(n),t0,e*1.6,.09,2600);tuneVoice('triangle',midi(n+12),t0,e*1.2,.035)}
    const r=TUNE.roots[bar],bass=[r,0,r,r+12,r,0,r+7,r+12][b];if(bass)tuneVoice('sawtooth',midi(bass),t0,e*.9,.13,700);
    if(b===0||b===4)tuneKick(t0);
    if(b===2||b===6)tuneNoise(t0,.12,.22,1800);
    if(b%2===1)tuneNoise(t0,.04,.08,7000);
    if(i===62)tuneVoice('sine',1760,t0,.09,.07);if(i===63)tuneVoice('sine',1760,t0,.09,.07);

function tuneStart(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();

/* the briefing lasts 3 minutes in all: each slide gets a share by how much there is to read (animations count extra) */
const BRIEF_MS=180000;
// one continuous 3-minute clock for the whole briefing; it runs on whichever slide is showing.
// Slides change on a fixed schedule inside those 3 minutes; Back/Next only move between slides.
let briefCd=null;
function briefWeights(){return t('brief').map(b=>{const txt=[b.tag,b.h,b.p,b.cap,...(b.li||[]).flat()].filter(Boolean).join(' ');return txt.split(/\s+/).length+(FIG[b.k]?40:0)})}
function slideMs(i){const w=briefWeights(),sum=w.reduce((a,b)=>a+b,0);return i<w.length?BRIEF_MS*w[i]/sum:0}
const briefOn=()=>!S.bPauseAt;
function briefUsed(){if(!S.bStart)return 0;const now=S.bPauseAt||Date.now();return Math.min(BRIEF_MS,now-S.bStart-(S.bPaused||0))}
const briefLeft=()=>BRIEF_MS-briefUsed();
// the slide the schedule says should be showing after `ms` of briefing
function schedSlide(ms){let acc=0;const n=t('brief').length;for(let k=0;k<n;k++){acc+=slideMs(k);if(ms<acc)return k}return n}
function briefTick(){const h=$('briefHd');if(S.phase!=='ready'||!h){clearInterval(briefCd);return}
  h.textContent=t('briefEyebrow',fmt(briefLeft()));const bar=$('bprog');if(bar)bar.style.width=(briefUsed()/BRIEF_MS*100)+'%';
  const k=schedSlide(briefUsed());if(k!==S.bSched){const first=S.bSched==null;S.bSched=k;if(!first&&k>(S.brief||0)){S.briefDir=1;S.brief=k;persist();render(false);return}persist()}}
function briefArm(){clearInterval(briefCd);if(S.phase!=='ready'||QUICK)return;if(!S.bStart){S.bStart=Date.now();S.bPaused=0;S.bPauseAt=null;S.bSched=null;persist()}
  briefTick();briefCd=setInterval(briefTick,500)}
function readyView(){
  if(QUICK)return `<div class="card hero brief"><div class="brief-body">${briefCard(t('brief').length)}</div>
    <div class="btnrow brief-nav"><button class="btn amber big" data-act="startRace">${t('startBtn')}</button><button class="linkbtn" data-act="editSignin">${t('changeSignin')}</button></div></div>`;
  const last=t('brief').length,i=Math.min(S.brief||0,last);
  return `<div class="card hero brief">
    <div class="row-h"><span class="eyebrow amber" id="briefHd">${t('briefEyebrow',fmt(briefLeft()))}</span><span class="dots" aria-label="${i+1} / ${last+1}">${Array.from({length:last+1},(_,k)=>`<i class="${k===i?'on':k<i?'past':''}"></i>`).join('')}</span></div>
    ${i<last?`<div class="bauto"><button class="btn" type="button" data-act="briefAuto" id="bAutoBtn" style="min-height:34px;padding:4px 14px">${briefOn()?t('pause'):t('play')}</button><span>${t('autoNote')}</span></div><div class="bprog"><i id="bprog" style="width:${briefUsed()/BRIEF_MS*100}%"></i></div>`:''}
    <div class="brief-body ${S.briefDir<0?'from-left':''}" key="${i}">${briefCard(i)}</div>
    <div class="btnrow brief-nav">
      ${i>0?`<button class="btn" data-act="briefNav" data-d="-1">${t('back')}</button>`:''}
      ${i<last?`<button class="btn primary" data-act="briefNav" data-d="1">${t('next')}</button><button class="linkbtn" data-act="briefSkip">${t('skipBrief')}</button>`
        :`<button class="btn amber big" data-act="startRace">${t('startBtn')}</button><button class="linkbtn" data-act="editSignin">${t('changeSignin')}</button>`}
    </div>
  </div>`;
}

   <p class="small muted">${t('plNote')}</p>`},
 linac(){const c=ch('linac',()=>({plan:null,planPts:null,wrongs:0,off:{x:nz(),y:nz(),z:nz()},tries:0,matched:false,sel:[],safety:null,safeTries:0,mu:0}));

   <div class="checks">${C().safety.map((x,i)=>{const on=c.sel.includes(i),good=SAFETY_OK[i];let cls='';if(c.safety!==null)cls=good&&on?'right':'';

/* alignment drawing: offsets in mm, 3 svg units per mm */
function alignViews(o,kind){
  const k=3,cbct=kind==='cbct';let front,side;
  if(!cbct){
    const head=(dx,dy)=>`<g transform="translate(${dx} ${dy})">`;
    front=`${head(o.x*k,o.y*k)}<path d="M82 148h36v16q42 4 56 34v12H26v-12q14-30 56-34z" fill="#F2F4F5" stroke="#A9B3B9" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="100" cy="98" rx="56" ry="68" fill="#F2F4F5" stroke="#A9B3B9" stroke-width="2.5"/><ellipse cx="78" cy="84" rx="12" ry="7" fill="#DCE1E4"/><ellipse cx="122" cy="84" rx="12" ry="7" fill="#DCE1E4"/><path d="M100 86 v26 l-7 6 h14" fill="none" stroke="#C3CBD0" stroke-width="2.5" stroke-linejoin="round"/><path d="M86 134 q14 7 28 0" fill="none" stroke="#C3CBD0" stroke-width="2.5"/><rect x="72" y="178" width="56" height="13" rx="2" fill="#1C1D20"/><text x="100" y="188" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="10" fill="#F2F4F5">MAX</text><path d="M92 100h16M100 92v16" stroke="#16212A" stroke-width="2.5"/></g>`;
    side=`${head(o.z*k,o.y*k)}<g transform="translate(46 -33.2) scale(3.6)">${PH()}<path d="M12.5 37h5M15 34.5v5" stroke="#16212A" stroke-width=".7"/></g></g>`;
  }else{
    const ref=`<ellipse cx="100" cy="100" rx="58" ry="70" fill="none" stroke="#E8961A" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="122" cy="96" r="10" fill="none" stroke="#E8961A" stroke-width="2"/>`;
    front=`<g transform="translate(${o.x*k} ${o.y*k})"><ellipse cx="100" cy="100" rx="58" ry="70" fill="#2C4A55" stroke="#5FD0DE" stroke-width="3"/><ellipse cx="100" cy="100" rx="46" ry="58" fill="#3E6470"/><circle cx="122" cy="96" r="10" fill="#7FB8C2"/></g>${ref}`;
    side=`<g transform="translate(${o.z*k} ${o.y*k})"><ellipse cx="100" cy="100" rx="66" ry="70" fill="#2C4A55" stroke="#5FD0DE" stroke-width="3"/><ellipse cx="96" cy="100" rx="52" ry="58" fill="#3E6470"/></g><ellipse cx="100" cy="100" rx="66" ry="70" fill="none" stroke="#E8961A" stroke-width="2.5" stroke-dasharray="6 4"/>`;
  }
  const laser=cbct?'':`<path d="M0 100H200M100 0V200" stroke="#FF3B30" stroke-width="1.6" opacity=".95"/>`;
  return `<div class="views"><div class="view"><svg viewBox="0 0 200 200" role="img" aria-label="${t('front')}">${front}${laser}</svg><small>${t('front')}</small></div>
  <div class="view"><svg viewBox="0 0 200 200" role="img" aria-label="${t('side')}">${side}${laser}</svg><small>${t('side')}</small></div></div>`;
}
function padView(key){
  const ax=[['x',t('axX'),'◀','▶'],['y',t('axY'),'▲','▼'],['z',t('axZ'),'◀','▶']];
  return `<div class="pad">${ax.map(([a,l,m,p])=>`<div class="axis"><b>${l}</b><div class="row">
    <button data-act="nudge" data-k="${key}" data-a="${a}" data-d="-5" aria-label="${l}: 5 mm ${m}">${m}${m}</button>
    <button data-act="nudge" data-k="${key}" data-a="${a}" data-d="-1" aria-label="${l}: 1 mm ${m}">${m}</button>
    <button data-act="nudge" data-k="${key}" data-a="${a}" data-d="1" aria-label="${l}: 1 mm ${p}">${p}</button>
    <button data-act="nudge" data-k="${key}" data-a="${a}" data-d="5" aria-label="${l}: 5 mm ${p}">${p}${p}</button></div></div>`).join('')}</div>`;
}

/* ================= planning maths ================= */
function inBeam(px,py,a){const r=a*Math.PI/180;const dx=Math.sin(r),dy=-Math.cos(r);return Math.abs((px-TUM.x)*dy-(py-TUM.y)*dx)<HW}
const inHead=(x,y)=>((x-HEAD.x)/HEAD.rx)**2+((y-HEAD.y)/HEAD.ry)**2<=1;
function calcPlan(beams){
  const n=beams.length,d={};
  OARS.forEach(o=>{let sum=0;o.pts.forEach(([x,y])=>{sum+=beams.filter(a=>inBeam(x,y,a)).length});d[o.id]=Math.round(sum/o.pts.length/n*100)});
  const skin=Math.round(100/n),probs=[];
  if(n<5)probs.push(t('plFew'));
  if(n>8)probs.push(t('plMany'));
  OARS.forEach(o=>{if(d[o.id]>o.lim)probs.push(t('plOver',C().oar[o.id],d[o.id],o.lim))});
  return {d,skin,pass:!probs.length,probs};
}
function planPoints(r,calcs){let p=60;OARS.forEach(o=>{if(r.d[o.id]>o.lim)p-=15});const n=S.ch.plan.beams.length;if(n<5||n>8)p-=15;p-=Math.max(0,calcs-3)*5;return Math.max(10,p)}
function label(g,txt,x,y,col){g.font='600 10px "Atkinson Hyperlegible", system-ui, sans-serif';const w=g.measureText(txt).width+8;
  g.fillStyle='rgba(11,19,24,.82)';g.beginPath();g.roundRect?g.roundRect(x-w/2,y-9,w,13,4):g.rect(x-w/2,y-9,w,13);g.fill();g.fillStyle=col;g.textAlign='center';g.fillText(txt,x,y+1)}
function drawCT(){
  const cv=$('ctc');if(!cv)return;const g=cv.getContext('2d');g.setTransform(2,0,0,2,0,0);
  const c=S.ch.plan;g.fillStyle='#000';g.fillRect(0,0,320,320);
  g.fillStyle='#CFD6D9';g.beginPath();g.ellipse(HEAD.x,HEAD.y,HEAD.rx,HEAD.ry,0,0,7);g.fill();
  g.fillStyle='#5E676C';g.beginPath();g.ellipse(HEAD.x,HEAD.y+4,HEAD.rx-9,HEAD.ry-11,0,0,7);g.fill();
  g.fillStyle='#6E777C';g.beginPath();g.ellipse(HEAD.x,HEAD.y+10,HEAD.rx-30,HEAD.ry-40,0,0,7);g.fill();
  if(c.calc&&c.beams.length){const n=c.beams.length;for(let y=0;y<320;y+=4)for(let x=0;x<320;x+=4){if(!inHead(x+2,y+2))continue;const k=c.beams.filter(a=>inBeam(x+2,y+2,a)).length;if(!k)continue;const f=k/n;
    g.fillStyle=f>.99?'rgba(224,49,43,.55)':f>.6?'rgba(232,150,26,.5)':f>.3?'rgba(240,210,60,.42)':'rgba(70,170,220,.38)';g.fillRect(x,y,4,4)}}
  g.save();g.beginPath();g.ellipse(HEAD.x,HEAD.y,HEAD.rx,HEAD.ry,0,0,7);g.clip();
  c.beams.forEach(a=>{const r=a*Math.PI/180,dx=Math.sin(r),dy=-Math.cos(r),px=-dy,py=dx;g.strokeStyle='rgba(255,241,217,.85)';g.lineWidth=1;g.setLineDash([4,3]);
    [-HW,HW].forEach(o=>{g.beginPath();g.moveTo(TUM.x+px*o-dx*400,TUM.y+py*o-dy*400);g.lineTo(TUM.x+px*o+dx*400,TUM.y+py*o+dy*400);g.stroke()})});
  g.restore();g.setLineDash([]);
  OARS.forEach(o=>{g.strokeStyle='#5FD0DE';g.lineWidth=2;g.fillStyle='rgba(95,208,222,.25)';g.beginPath();g.arc(o.x,o.y,o.r,0,7);g.fill();g.stroke()});
  g.strokeStyle='#E8961A';g.lineWidth=2.5;g.fillStyle='rgba(232,150,26,.35)';g.beginPath();g.arc(TUM.x,TUM.y,TUM.r,0,7);g.fill();g.stroke();
  // labels on dark chips so they read over bone and dose
  label(g,C().oar.eyeL,OARS[0].x-6,OARS[0].y+28,'#BFF3FA');label(g,C().oar.eyeR,OARS[1].x+8,OARS[1].y+28,'#BFF3FA');
  label(g,C().oar.stem,OARS[2].x,OARS[2].y+28,'#BFF3FA');label(g,t('tumour'),TUM.x,TUM.y+30,'#FFD48A');
  g.font='600 10px "JetBrains Mono", ui-monospace, monospace';g.textAlign='center';
  ANGLES.forEach(a=>{const r=a*Math.PI/180,R=148;let x=160+Math.sin(r)*R,y=160-Math.cos(r)*R+4;x=Math.min(300,Math.max(20,x));y=Math.min(314,Math.max(12,y));
    g.fillStyle=c.beams.includes(a)?'#E8961A':'#8A979F';g.fillText(a+'°',x,y)});
  g.fillStyle='#9FB3BD';g.textAlign='left';g.fillText(t('ant'),6,12);
}

/* ================= beam on ================= */
let beamTimer=null,beamLast=0,hum=null;
function beamStart(e){e.preventDefault();const c=S.ch.linac;if(!c||c.mu>=MU_TARGET)return;$('beamBtn').classList.add('hot');beamLast=performance.now();
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(!hum){const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=110;g.gain.value=.025;o.connect(g);g.connect(AC.destination);o.start();hum=o}}catch(err){}
  clearInterval(beamTimer);beamTimer=setInterval(()=>{const now=performance.now();c.mu=Math.min(MU_TARGET,c.mu+(now-beamLast)/1000*150);beamLast=now;
    const v=$('muv'),b=$('mub');if(v)v.textContent=Math.floor(c.mu);if(b)b.style.width=(c.mu/MU_TARGET*100)+'%';
    if(c.mu>=MU_TARGET){beamStop();S.st.linac.dig=c.planPts+c.matchPts+c.safety;ok();persist();render()}},50)}
function beamStop(){clearInterval(beamTimer);beamTimer=null;const b=$('beamBtn');if(b)b.classList.remove('hot');try{if(hum){hum.stop();hum=null}}catch(e){}persist()}

const ACT={
 quiz(b){const c=ch(b.dataset.k,()=>({ans:{}}));const q=+b.dataset.q;if(c.ans[q]!==undefined)return;c.ans[q]=+b.dataset.o;
   const ans=QA[b.dataset.k];(ans[q]===c.ans[q]?ok:no)();checkDone();persist();render()},

 nudge(b){const c=S.ch[b.dataset.k];c.off[b.dataset.a]+= +b.dataset.d;c.msg=false;tone(520,.04,'triangle',.04);persist();render()},
 ctcheck(){const c=S.ch.ct;c.tries++;const o=c.off;if(Math.abs(o.x)<=1&&Math.abs(o.y)<=1&&Math.abs(o.z)<=1){c.aligned=true;c.alignPts=Math.max(10,30-(c.tries-1)*5);ok()}else{c.msg=true;no()}persist();render()},
 cbcheck(){const c=S.ch.linac;c.tries++;const o=c.off;if(Math.abs(o.x)<=1&&Math.abs(o.y)<=1&&Math.abs(o.z)<=1){c.matched=true;c.matchPts=Math.max(10,25-(c.tries-1)*5);ok()}else{c.msg=true;no()}persist();render()},
 loadplan(b){const c=S.ch.linac,i=+b.dataset.i;if(c.planPts!==null)return;c.plan=i;if(i===LIN_A){c.planPts=QUICK?Math.max(10,30-(c.wrongs||0)*10):Math.max(0,15-(c.wrongs||0)*10);ok()}else{c.wrongs=(c.wrongs||0)+1;no()}persist();render()},
 ssubmit(){const c=S.ch.linac;c.safeTries++;const good=SAFETY_OK.every((v,i)=>v===c.sel.includes(i));
   if(good){c.safety=QUICK?(c.safeTries===1?30:15):(c.safeTries===1?20:10);ok()}else{c.smsg=SAFETY_OK.some((v,i)=>!v&&c.sel.includes(i))?'lnInterlockIn':'lnInterlockMiss';no()}persist();render()},
 beam(b){const c=S.ch.plan,a=+b.dataset.a;c.beams=c.beams.includes(a)?c.beams.filter(x=>x!==a):[...c.beams,a].sort((x,y)=>x-y);c.calc=null;persist();render()},
 calc(){const c=S.ch.plan;c.calcs++;c.calc=true;(calcPlan(c.beams).pass?ok:no)();persist();render()},
 approve(){const c=S.ch.plan;S.st.plan.dig=planPoints(calcPlan(c.beams),c.calcs);ok();persist();render()},
 signoff(){openSignoff()},
 settings(){openSettings()},
 clearBoard(){openPin(t('clearBoardQ'),t('clearBoardBtn'),()=>{save(BOARD,[]);render()})},
 goCT(){const st=S.st[IDS[0]];if(st.dig===null)return;st.done=true;st.at=Date.now();S.idx=1;ok();persist();render(false)},
 startRace(){S.phase='race';S.start=Date.now();persist();tone(880,.2);wake();render(false)},
 pickRole(b){keepForm();const i=+b.dataset.i,r=b.dataset.r;S.roles=S.roles||[];S.roles[i]=S.roles[i]===r?'':r;tone(560,.04,'triangle',.04);persist();render()},
 demoGo(){S=fresh();Object.assign(S,JSON.parse(JSON.stringify(DEMO_TEAM)));S.phase='ready';tone(660,.12);persist();render(false)},
 editSignin(){S.phase='setup';persist();render(false)},
 briefNav(b){S.briefDir=+b.dataset.d;S.brief=Math.min(t('brief').length,Math.max(0,(S.brief||0)+ +b.dataset.d));tone(560,.05,'triangle',.04);persist();render(false)},
 tune(){if(tuneOn){tuneMuted=true;tuneStop()}else{tuneMuted=false;tuneStart()}},
 storyToggle(){storyOn=!storyOn;$('storyPlay').textContent=storyOn?t('pause'):t('play');if(storyOn)storyStart()},
 storyGo(b){storyShow(+b.dataset.i);storyStart()},
 lookBack(b){openLesson(+b.dataset.l)},
 demoGoBtn(){if(S.demoAt)return;S.demoAt=Date.now();persist();tone(740,.12);render(false)},
 demoEndBtn(){demoEnd(false)},
 briefAuto(){if(S.bPauseAt){S.bPaused=(S.bPaused||0)+(Date.now()-S.bPauseAt);S.bPauseAt=null}else S.bPauseAt=Date.now();
   persist();$('bAutoBtn').textContent=briefOn()?t('pause'):t('play')},
 demoRestart(){if(!DEMO)return;beamStop();S=fresh();persist();render(false)},
 introNav(b){const c=S.ch.intro;c.card=Math.max(0,Math.min(t('intro').length-1,c.card+ +b.dataset.d));if(c.card===t('intro').length-1)c.seen=true;tone(560,.05,'triangle',.04);persist();render()},
 briefSkip(){S.brief=t('brief').length;persist();render(false)},
 endRun(){openPin(t('endRunQ'),t('endRunBtn'),()=>finish('stopped'))},
 newTeam(){openPin(t('nextTeamQ'),t('nextTeamBtn'),()=>{S=fresh();persist();render(false)})},
 copyBoard(){const board=load(BOARD,[]);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
   const csv=[t('csvHead')].concat(board.map((r,i)=>[i+1,q(r.team),q(r.school),q((r.names||[]).map((n,k)=>mem(n,(r.roles||[])[k])).join('; ')),r.theory??'',r.inter??'',r.mark20??'',fmt(r.used),r.done?t('yes'):t('no'),r.stations??'',q(r.at)].join(','))).join('\n');
   const box=$('csvBox');const show=()=>{box.hidden=false;box.value=csv;box.focus();box.select()};
   try{navigator.clipboard.writeText(csv).then(()=>toast(t('copied')),show)}catch(e){show()}}
};

/* ================= modals ================= */
function toast(msg){const el=$('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{el.hidden=true},2600)}
function closeModal(){$('modal').hidden=true}
function openSignoff(){const id=IDS[S.idx];let stars=null;$('modalCard').innerHTML=''; // start with an empty PIN, never the last staff member's
  const draw=()=>{const pin=$('pinIn')?$('pinIn').value:'';
   $('modalCard').innerHTML=`<span class="eyebrow amber">${t('marshalOnly')}</span><h2>${t('soModalH',stFull(id))}</h2>
   <p class="small">${t('soModalP',STAR_MAX)}</p>
   <div class="stars" role="group">${Array.from({length:STAR_MAX+1},(_,n)=>n).map(n=>`<button type="button" data-n="${n}" aria-pressed="${stars===n}" aria-label="${t('stars',n)}">${n===0?'<b>0</b>':STAR+(n>1?'<b class="small">×'+n+'</b>':'')}</button>`).join('')}</div>
   <div class="field"><label for="pinIn">${t('pin')}</label><input id="pinIn" class="pin" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore name="marshal-check" value="${esc(pin)}"></div>
   <p class="err" id="pinErr"></p>${DEMO?`<p class="small muted">${t('demoPin',esc(cfg.pin))}</p>`:''}
   <div class="btnrow end"><button class="btn" type="button" id="mCancel">${t('cancel')}</button><button class="btn amber" type="button" id="mOk">${t('signOff')}</button></div>`;
   $('modalCard').querySelectorAll('.stars button').forEach(b=>b.onclick=()=>{stars=+b.dataset.n;draw()});
   $('mCancel').onclick=closeModal;
   $('mOk').onclick=()=>{if(stars===null){$('pinErr').textContent=t('ePickStars',STAR_MAX);return}
     if($('pinIn').value!==cfg.pin){$('pinErr').textContent=t('eWrongPin');no();return}
     const st=S.st[id];st.stars=stars;st.done=true;st.at=Date.now();closeModal();ok();
     if(S.idx===IDS.length-1)finish('done');else{S.idx++;persist();render(false)}}};
  draw();$('modal').hidden=false;setTimeout(()=>{const p=$('pinIn');if(p)p.focus()},50)}
function openPin(title,label,fn){$('modalCard').innerHTML=`<span class="eyebrow amber">${t('marshalOnly')}</span><h2>${title}</h2>
  <div class="field"><label for="pinIn">${t('pin')}</label><input id="pinIn" class="pin" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore name="marshal-check"></div><p class="err" id="pinErr"></p>${DEMO?`<p class="small muted">${t('demoPin',esc(cfg.pin))}</p>`:''}
  <div class="btnrow end"><button class="btn" type="button" id="mCancel">${t('cancel')}</button><button class="btn amber" type="button" id="mOk">${label}</button></div>`;
  $('mCancel').onclick=closeModal;$('mOk').onclick=()=>{if($('pinIn').value!==cfg.pin){$('pinErr').textContent=t('eWrongPinShort');return}closeModal();fn()};
  $('modal').hidden=false;setTimeout(()=>$('pinIn').focus(),50)}
function openSettings(){openPin(t('settings'),t('unlock'),()=>{
  $('modalCard').innerHTML=`<span class="eyebrow amber">${t('settings')}</span><h2>${t('setH')}</h2>
   <div class="row2"><div class="field"><label for="sMin">${t('setMin')}</label><input id="sMin" type="number" min="5" max="60" value="${cfg.minutes}"></div>
   <div class="field"><label for="sPin">${t('pin')}</label><input id="sPin" inputmode="numeric" maxlength="8" value="${esc(cfg.pin)}"></div></div>
   <p class="small muted">${t('setNote')}</p><p class="err" id="sErr"></p>
   <div class="btnrow end"><button class="btn" type="button" id="mCancel">${t('cancel')}</button><button class="btn primary" type="button" id="mOk">${t('save')}</button></div>`;
  $('mCancel').onclick=closeModal;$('mOk').onclick=()=>{const m=parseInt($('sMin').value,10),p=$('sPin').value.trim();
    if(!(m>=5&&m<=60)){$('sErr').textContent=t('eMin');return}if(p.length<4){$('sErr').textContent=t('ePin');return}
    cfg={pin:p,minutes:m};save(CFG,cfg);closeModal();render()};
  $('modal').hidden=false})}


/* ================= marks: theory /10 + interactive /10 =================
   Every mark comes from one row below, so teams can see exactly where each one came from.
   Questions count only when right first time. Staff stars are 1 mark each. */
const STAR_MAX=QUICK?3:2;
const MKL={
 en:{introQ:'Introduction question',ctQ:'CT question',ctQs:'CT questions (2)',linQ:'Linac question (right first time)',clinQ:'Clinic questions (3)',
  lasers:'CT lasers lined up',plan:'Treatment plan passes',match:'Cone-beam CT match',safety:'Safety check (right first time)',
  starsCT:'Staff stars at CT',starsPlan:'Staff stars at planning',starsLin:'Staff stars at the linac',
  each:'{0} each',got:'Got',outOf:'Out of'},
 ms:{introQ:'Soalan pengenalan',ctQ:'Soalan CT',ctQs:'Soalan CT (2)',linQ:'Soalan linac (betul kali pertama)',clinQ:'Soalan klinik (3)',
  lasers:'Laser CT diselaraskan',plan:'Pelan rawatan lulus',match:'Padanan CT alur kon',safety:'Semakan keselamatan (betul kali pertama)',
  starsCT:'Bintang staf di CT',starsPlan:'Bintang staf di perancangan',starsLin:'Bintang staf di linac',
  each:'{0} setiap satu',got:'Dapat',outOf:'Daripada'}};
const ml=(k,...a)=>{let v=(MKL[LANG]||MKL.en)[k];a.forEach((x,i)=>v=v.replace('{'+i+'}',x));return v};
function markItems(){const qa=(k,A)=>{const c=S.ch[k];return c?A.filter((v,i)=>c.ans[i]===v).length:0};
  const ct=S.ch.ct||{},ln=S.ch.linac||{},stars=id=>S.st[id]&&S.st[id].stars||0,linRight=ln.planPts!=null&&!ln.wrongs;
  if(QUICK)return [
   {st:'intro',k:'th',l:ml('introQ'),max:3,got:qa('introq',[1])*3},
   {st:'ct',k:'th',l:ml('ctQ'),max:3,got:qa('ctq',[1])*3},
   {st:'linac',k:'th',l:ml('linQ'),max:4,got:linRight?4:0},
   {st:'ct',k:'in',l:ml('lasers'),max:2,got:ct.aligned?(ct.tries<=2?2:1):0},
   {st:'ct',k:'in',l:ml('starsCT'),max:3,got:stars('ct')},
   {st:'linac',k:'in',l:ml('safety'),max:2,got:ln.safety!=null?(ln.safeTries===1?2:1):0},
   {st:'linac',k:'in',l:ml('starsLin'),max:3,got:stars('linac')}];
  const pl=S.ch.plan,plOk=S.st.plan&&S.st.plan.dig!==null&&pl&&calcPlan(pl.beams).pass;
  return [
   {st:'clinic',k:'th',l:ml('clinQ'),note:ml('each',2),max:6,got:qa('clinic',CLINIC_A)*2},
   {st:'ct',k:'th',l:ml('ctQs'),note:ml('each',1),max:2,got:qa('ctq',CT_A)},
   {st:'linac',k:'th',l:ml('linQ'),max:2,got:linRight?2:0},
   {st:'ct',k:'in',l:ml('lasers'),max:1,got:ct.aligned?1:0},
   {st:'ct',k:'in',l:ml('starsCT'),max:2,got:stars('ct')},
   {st:'plan',k:'in',l:ml('plan'),max:1,got:plOk?1:0},
   {st:'plan',k:'in',l:ml('starsPlan'),max:2,got:stars('plan')},
   {st:'linac',k:'in',l:ml('match'),max:1,got:ln.matched?1:0},
   {st:'linac',k:'in',l:ml('safety'),max:1,got:ln.safety!=null&&ln.safeTries===1?1:0},
   {st:'linac',k:'in',l:ml('starsLin'),max:2,got:stars('linac')}]}
function marks(){const it=markItems(),sum=k=>it.filter(x=>x.k===k).reduce((a,x)=>a+x.got,0);const th=sum('th'),inter=sum('in');return {th,inter,sum:th+inter}}
function markTable(showGot){const it=markItems(),row=x=>`<tr><td>${x.l}${x.note?` <span class="small muted">· ${x.note}</span>`:''}</td>${showGot?`<td class="n"><b>${x.got}</b></td>`:''}<td class="n">${x.max}</td></tr>`;
  const part=(k,h)=>`<tr class="mkhead"><td colspan="${showGot?3:2}"><b>${h}</b> /10</td></tr>${it.filter(x=>x.k===k).map(row).join('')}`;
  return `<div class="tblwrap"><table class="tbl mk">${showGot?`<thead><tr><th></th><th class="n">${ml('got')}</th><th class="n">${ml('outOf')}</th></tr></thead>`:''}<tbody>${part('th',t('theory'))}${part('in',t('interactive'))}</tbody></table></div>`}
const mk=n=>String(n);
/* ================= done ================= */
function doneView(){
  const treated=S.reason==='done',used=Math.min(limit(),elapsed());
  const board=load(BOARD,[]);const rank=board.findIndex(r=>r.id===S.runId)+1;
  return `<div class="card hero">
   <span class="eyebrow ${treated?'':'amber'}">${treated?t('dnTreated'):S.reason==='stopped'?t('dnStopped'):t('dnTime')}</span>
   <h2>${treated?t('dnTreatedH',esc(teamName(S.team)),fmt(used)):t('dnStopH',esc(teamName(S.team)),stFull(IDS[S.idx]))}</h2>
   <p class="muted">${esc(S.school)} · ${esc(S.names.map((n,k)=>mem(n,(S.roles||[])[k])).join(', '))}</p>
   ${finalView()}
   ${rank?`<p class="muted">${t('rankN',rank,board.length)}</p>`:''}
   ${markTable(true)}
   <p class="why">${treated?t('dnWhyT'):t('dnWhyF')}</p>
   <div class="btnrow"><button class="btn amber" data-act="newTeam">${t('nextTeam')}</button></div>
  </div>
  ${boardView(board,S.runId)}
  <div class="card"><h3>${t('whoH')}</h3>
   <div class="tblwrap"><table class="tbl"><tbody>${t('roles').map(([r,d])=>`<tr><td><b>${r}</b></td><td>${d}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ================= boot ================= */
if(S.phase==='race'&&left()<=0)finish('time');
render();startTick();if(S.phase==='race')wake();
})();
</script>
